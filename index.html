<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>FASTHCK Vacaciones</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>FASTHCK Vacaciones</h1>

<!-- LOGIN -->
<div id="login">
  <input type="email" id="usuario" placeholder="Correo">
  <button onclick="login()">Entrar</button>
</div>

<!-- APP -->
<div id="app" style="display:none;">

  <button id="logoutBtn" onclick="logout()">Cerrar sesión</button>

  <h2 id="titulo"></h2>

  <!-- EMPLEADO -->
  <div id="empleadoPanel">
    <input type="text" id="nombre" placeholder="Nombre">
    <input type="date" id="inicio">
    <input type="date" id="fin">

    <!-- NUEVO -->
    <select id="periodo">
      <option value="Primer periodo">Primer periodo</option>
      <option value="Segundo periodo">Segundo periodo</option>
    </select>

    <input type="text" id="area" placeholder="Área">

    <button onclick="enviarSolicitud()">Enviar solicitud</button>

    <ul id="lista"></ul>
  </div>

  <!-- ADMIN -->
  <div id="adminPanel" style="display:none;">

    <!-- FILTRO POR FECHAS -->
    <h3>Filtrar por fechas</h3>
    <input type="date" id="filtroInicio">
    <input type="date" id="filtroFin">
    <button onclick="filtrarPorFecha()">Filtrar</button>

    <div id="solicitudes"></div>
  </div>

</div>

<script type="module" src="app.js"></script>
</body>
</html>
