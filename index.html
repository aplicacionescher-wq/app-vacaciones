<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>App Vacaciones</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <h2>Iniciar sesión</h2>
  <input type="email" id="correo" placeholder="Correo">
  <input type="password" id="password" placeholder="Contraseña">
  <button onclick="login()">Ingresar</button>
</div>

<!-- EMPLEADO -->
<div id="formulario" style="display:none;">
  <h2>Solicitud de Vacaciones</h2>

  <input id="nombre" placeholder="Nombre completo">
  <input id="area" placeholder="Área">

  <select id="periodo">
    <option value="Primer periodo">Primer periodo</option>
    <option value="Segundo periodo">Segundo periodo</option>
  </select>

  <input type="date" id="inicio">
  <input type="date" id="fin">

  <label>
    <input type="checkbox" id="empresa">
    Nivel empresa total
  </label>

  <br>

  <button onclick="enviarSolicitud()">Enviar</button>
  <button onclick="logout()">Cerrar sesión</button>

  <h3>Mis solicitudes</h3>
  <div id="misSolicitudes"></div>
</div>

<!-- ADMIN -->
<div id="adminPanel" style="display:none;">
  <h2>Panel Administrador</h2>

  <input type="date" id="filtroInicio">
  <input type="date" id="filtroFin">

  <select id="filtroEstado">
    <option value="todas">Todas</option>
    <option value="en proceso">Pendientes</option>
    <option value="aprobada">Aprobadas</option>
    <option value="cancelada">Canceladas</option>
  </select>

  <button onclick="cargarSolicitudes()">Filtrar</button>
  <button onclick="logout()">Cerrar sesión</button>

  <div id="solicitudes"></div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
