<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Vacaciones Empresa</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Solicitud de Vacaciones</h1>

  <!-- LOGIN -->
  <div id="login">
    <input type="email" id="email" placeholder="Correo">
    <input type="password" id="password" placeholder="Contraseña">
    <button onclick="login()">Ingresar</button>
  </div>

  <!-- FORMULARIO USUARIO -->
  <div id="formulario" style="display:none;">
    <button onclick="logout()">Cerrar sesión</button>

    <input type="text" id="nombre" placeholder="Nombre completo">
    <input type="date" id="inicio">
    <input type="date" id="fin">
    <input type="text" id="periodo" placeholder="Periodo (ej. 2025)">
    <input type="text" id="area" placeholder="Área">

    <button onclick="enviarSolicitud()">Enviar solicitud</button>
  </div>

  <!-- ADMIN -->
  <div id="adminPanel" style="display:none;">

    <h2>Panel Administrador</h2>

    <!-- 🔴 BOTÓN LOGOUT -->
    <button onclick="logout()">Cerrar sesión</button>

    <h3>Filtros</h3>

    <input type="date" id="filtroInicio">
    <input type="date" id="filtroFin">

    <select id="filtroEstado">
      <option value="pendiente">Pendientes</option>
      <option value="todas">Todas</option>
      <option value="aprobada">Aprobadas</option>
      <option value="cancelada">Canceladas</option>
    </select>

    <button onclick="aplicarFiltros()">Aplicar filtros</button>

    <div id="solicitudes"></div>

  </div>

  <script type="module" src="app.js"></script>

</body>
</html>
